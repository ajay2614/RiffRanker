server:
  port: 8082

spring:
  application:
    name: artist-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/riffrank_artist
    username: ${MYSQL_USER:riffrank}
    password: ${MYSQL_PASSWORD:riffrank}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

riffrank:
  admin-key: dev-admin-key
