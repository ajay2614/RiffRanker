<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="'Top 100 ' + ${genre} + ' - RiffRank'"></title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; color: #111; }
    a { color: #1b4dd8; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <p><a href="/">← Home</a></p>
  <h1 th:text="'Top 100 ' + ${genre}"></h1>
  <p class="muted">Sorted by weighted rating.</p>

  <table>
    <thead>
    <tr>
      <th>#</th>
      <th>Song</th>
      <th>Artist</th>
      <th>Weighted rating</th>
      <th>Votes</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(songs)}">
      <td colspan="5" class="muted">No songs yet for this genre. Add songs and ratings.</td>
    </tr>
    <tr th:each="s, iStat : ${songs}">
      <td th:text="${iStat.count}"></td>
      <td><a th:href="@{'/song/' + ${s.id}}" th:text="${s.title}"></a></td>
      <td th:text="${s.artistName}"></td>
      <td>
        <span th:if="${s.weightedRating != null}" th:text="${#numbers.formatDecimal(s.weightedRating, 1, 1)}"></span>
        <span th:if="${s.weightedRating == null}" class="muted">—</span>
      </td>
      <td th:text="${s.ratingCount}"></td>
    </tr>
    </tbody>
  </table>
</body>
</html>
