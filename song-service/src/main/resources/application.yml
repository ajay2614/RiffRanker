server:
  port: 8081

spring:
  application:
    name: song-service
  datasource:
    url: jdbc:h2:mem:songs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

riffrank:
  admin-key: dev-admin-key
  rating:
    minimum-votes: 50

