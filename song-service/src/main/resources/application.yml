server:
  port: 8081

spring:
  application:
    name: song-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/riffrank_song
    username: ${MYSQL_USER:riffrank}
    password: ${MYSQL_PASSWORD:riffrank}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

riffrank:
  admin-key: dev-admin-key
  rating:
    minimum-votes: 1

jwt:
  secret: "riffrank-super-secret-key-for-jwt-hs512-algorithm-minimum-64-chars-required-for-security-compliance"
  expiration-ms: 2592000000
