server:
  port: 8084
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:users;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: "riffrank-super-secret-key-for-jwt-hs512-algorithm-minimum-64-chars-required-for-security-compliance"
  expiration-ms: 2592000000

logging:
  level:
    root: INFO
